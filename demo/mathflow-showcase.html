<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MathFlow — Interactive Math Visualization Showcase</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #171B21;
      color: #E8E8E8;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .demo-app {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    .demo-header {
      text-align: center;
      padding: 40px 0 24px;
    }

    .demo-logo {
      font-size: 2.4em;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #7c58ff, #58a6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .demo-tagline {
      font-size: 1em;
      color: #8A8F98;
      margin-top: 4px;
    }

    .demo-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      padding: 20px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      position: sticky;
      top: 0;
      background: rgba(23, 27, 33, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 10;
    }

    .demo-tab {
      padding: 6px 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      background: transparent;
      color: #8A8F98;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .demo-tab:hover {
      border-color: rgba(255, 255, 255, 0.2);
      color: #E8E8E8;
    }

    .demo-tab-active {
      background: #58a6ff;
      border-color: #58a6ff;
      color: white;
    }

    .demo-tab-active:hover {
      color: white;
      border-color: #4a94e8;
    }

    .demo-controls {
      display: flex;
      justify-content: flex-end;
      padding: 12px 0;
    }

    .demo-json-toggle {
      padding: 4px 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      background: transparent;
      color: #8A8F98;
      font-size: 12px;
      font-family: "SF Mono", "Fira Code", monospace;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .demo-json-toggle:hover {
      border-color: rgba(255, 255, 255, 0.2);
      color: #E8E8E8;
    }

    .demo-json {
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      background: #1E2228;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 11px;
      line-height: 1.5;
      overflow-x: auto;
      max-height: 400px;
      margin-bottom: 16px;
      color: #B0B8C4;
    }

    .demo-renderer {
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./demo-bundle.js"></script>
</body>
</html>
